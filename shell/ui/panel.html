<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shelf</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .shelf {
    position: fixed; inset: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 8px; background: rgba(32, 33, 36, .72); color: #fff;
  }
  .left { display: flex; align-items: center; }
  .launch {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  }
  .launch:hover, .launch.on { background: rgba(255,255,255,.14); }
  .launch i { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; display: block; }
  #apps { display: flex; gap: 4px; align-items: center; }
  .app {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; position: relative; cursor: pointer;
  }
  .app:hover { background: rgba(255,255,255,.12); }
  .app .ic {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 18px;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .app .dot {
    position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.6);
  }
  .app.active .dot { width: 14px; background: #fff; }
  .app.many .dot { box-shadow: 6px 0 0 rgba(255,255,255,.6); }
  .right { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .pill {
    display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border-radius: 18px;
    cursor: pointer; font-size: 13.5px; font-weight: 500;
  }
  .pill:hover, .pill.on { background: rgba(255,255,255,.14); }
  .pill svg { width: 16px; height: 16px; fill: #fff; }
  #date { opacity: .9; }
</style>
</head>
<body>
<div class="shelf">
  <div class="left"><div class="launch" id="launch"><i></i></div></div>
  <div id="apps"></div>
  <div class="right">
    <div class="pill" id="datepill"><span id="date"></span></div>
    <div class="pill" id="status">
      <svg viewBox="0 0 24 24"><path d="M12 21 0 8.6C3.3 5.7 7.5 4 12 4s8.7 1.7 12 4.6L12 21z"/></svg>
      <span id="time"></span>
    </div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
let apps = [], wins = [], pinned = [];
$("#launch").onclick = () => os.system.launcher();
$("#status").onclick = () => os.call("system.quick");
$("#datepill").onclick = () => os.apps.launch("clock");
function tick() {
  const n = new Date();
  $("#time").textContent = n.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("#date").textContent = n.toLocaleDateString([], { day: "numeric", month: "short" });
}
function render() {
  const box = $("#apps");
  box.innerHTML = "";
  const ids = [...pinned];
  wins.forEach((w) => { if (!ids.includes(w.appId)) ids.push(w.appId); });
  ids.forEach((id) => {
    const a = apps.find((x) => x.id === id);
    const mine = wins.filter((w) => w.appId === id);
    if (!a && !mine.length) return;
    const src = a || mine[0];
    const el = document.createElement("div");
    el.className = "app" + (mine.some((w) => w.active && !w.minimized) ? " active" : "") + (mine.length > 1 ? " many" : "");
    el.innerHTML = os.tile(src, "ic") + (mine.length ? `<div class="dot"></div>` : "");
    el.title = a ? a.name : mine[0].title;
    el.onclick = () => {
      if (!mine.length) return os.apps.launch(id);
      const act = mine.findIndex((w) => w.active && !w.minimized);
      // cycle through this app's windows, minimise if it's the only one and already active
      const next = mine.length > 1 && act >= 0 ? mine[(act + 1) % mine.length] : mine[0];
      os.windows.focus(next.id);
    };
    el.onauxclick = (e) => { if (e.button === 1) mine.forEach((w) => os.windows.close(w.id)); };
    el.oncontextmenu = (e) => { e.preventDefault(); os.call("shelf.togglePin", id); };
    box.appendChild(el);
  });
}
os.on("windows", (w) => { wins = w; render(); });
os.on("apps", (a) => { apps = a; render(); });
os.on("settings", (s) => { pinned = s.pinned || []; render(); });
os.on("popup", (p) => { $("#launch").classList.toggle("on", p === "launcher"); $("#status").classList.toggle("on", p === "quick"); });
Promise.all([os.apps.list(), os.windows.list(), os.settings.get()]).then(([a, w, s]) => { apps = a; wins = w; pinned = s.pinned || []; render(); });
document.addEventListener("contextmenu", (e) => e.preventDefault());
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
