<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Menu</title>
<link rel="stylesheet" href="glass.css">
<script src="glass.js"></script>
<style>
  #m { position: fixed; inset: 26px; border-radius: 13px; padding: 6px; background: var(--tint-strong); }
  .row {
    height: 26px; padding: 0 10px; border-radius: 7px; display: flex; align-items: center; gap: 12px;
    white-space: nowrap;
  }
  .row .k { margin-left: auto; color: var(--muted); font-size: 12px; }
  .row.on { background: var(--accent); color: var(--on-accent); }
  .row.on .k { color: var(--on-accent); opacity: .8; }
  .row.off { opacity: .38; }
  .row .l { overflow: hidden; text-overflow: ellipsis; }
  .sep { height: 1px; margin: 5px 10px; background: var(--hairline); }
</style>
</head>
<body>
<div class="glass" id="m"></div>
<script>
const $ = (s) => document.querySelector(s);
let items = [], sel = -1;
function render() {
  const m = $("#m");
  m.querySelectorAll(".row,.sep").forEach((e) => e.remove());
  items.forEach((it, i) => {
    if (it.sep) { const d = document.createElement("div"); d.className = "sep"; m.appendChild(d); return; }
    const d = document.createElement("div");
    d.className = "row" + (i === sel ? " on" : "") + (it.disabled || !it.action ? " off" : "");
    d.innerHTML = `<span class="l"></span>${it.key ? `<span class="k">${Glass.esc(it.key)}</span>` : ""}`;
    d.querySelector(".l").textContent = it.label;
    d.onmouseenter = () => { sel = i; paint(); };
    d.onmouseup = () => choose(i);
    m.appendChild(d);
  });
}
function paint() { document.querySelectorAll(".row").forEach((r) => r.classList.remove("on")); const rows = [...$("#m").children].filter((e) => e.matches(".row,.sep")); if (rows[sel] && rows[sel].classList.contains("row")) rows[sel].classList.add("on"); }
function choose(i) {
  const it = items[i];
  if (!it || it.sep || it.disabled || !it.action) return;
  os.call("menu.do", it.action);
}
function move(d) {
  for (let n = 0; n < items.length; n++) {
    sel = (sel + d + items.length) % items.length;
    if (!items[sel].sep && !items[sel].disabled) break;
  }
  paint();
}
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") move(1);
  else if (e.key === "ArrowUp") move(-1);
  else if (e.key === "Enter") choose(sel);
  else if (e.key === "Escape") os.call("menu.do", "");
});
os.on("menu-open", (d) => {
  items = d.items || []; sel = -1;
  render();
  Glass.backdrop($("#m"), Glass.snapshotCss(d.bg));
});
os.on("settings", Glass.applySettings);
os.settings.get().then(Glass.applySettings);
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("mousedown", (e) => { if (!e.target.closest("#m")) os.call("menu.do", ""); });
</script>
</body>
</html>
