# BookerOS compositor settings (picom, software rendering so it works in any VM)
backend = "xrender";
vsync = false;
use-damage = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.32;
shadow-offset-x = -16;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
no-fading-openclose = false;
no-fading-destroyed-argb = true;
fade-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];

detect-client-opacity = true;
detect-rounded-corners = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;
