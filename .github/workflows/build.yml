# Builds both BookerOS editions on GitHub's servers and publishes them together as a release:
#   bookeros-web.iso    ChromeOS-style shelf and launcher
#   bookeros-glass.iso  glassy menu bar, dock and Spotlight
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
name: Build ISO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [web, glass]
    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin xorriso mtools curl

      - name: Build the ${{ matrix.edition }} ISO (about 15-25 minutes)
        run: |
          BUILD=$(ls build.sh webos/build.sh 2>/dev/null | head -1)
          if [ -z "$BUILD" ]; then echo "::error::build.sh not found"; exit 1; fi
          chmod +x "$BUILD"
          sudo EDITION=${{ matrix.edition }} OUT="$RUNNER_TEMP/bookeros-${{ matrix.edition }}.iso" "./$BUILD" "$RUNNER_TEMP/work" 2>&1 | tee "$RUNNER_TEMP/build.log"
          sudo chown "$USER" "$RUNNER_TEMP/bookeros-${{ matrix.edition }}.iso"
          ls -lh "$RUNNER_TEMP/bookeros-${{ matrix.edition }}.iso"
          if grep -q "building without Firefox\|Firefox install failed" "$RUNNER_TEMP/build.log"; then
            echo "::warning::Firefox could not be installed; this ISO uses the built-in browser"
          fi

      - name: Keep the ISO for the release step
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.edition }}
          path: ${{ runner.temp }}/bookeros-${{ matrix.edition }}.iso
          retention-days: 3
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Collect the ISOs
        uses: actions/download-artifact@v4
        with:
          pattern: iso-*
          merge-multiple: true
          path: isos

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd isos
          sha256sum *.iso > SHA256SUMS
          ls -lh
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" *.iso SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "BookerOS (build ${{ github.run_number }})" \
            --notes "Built from commit ${{ github.sha }}.

          - **bookeros-web.iso**: ChromeOS-style edition (shelf, launcher, Quick Settings)
          - **bookeros-glass.iso**: Glass edition (menu bar, dock, Spotlight, Control Center)

          Attach either ISO to a VirtualBox VM's optical drive and start it." \
            --latest
          echo "### ISOs ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/${{ github.repository }}/releases/latest" >> "$GITHUB_STEP_SUMMARY"
